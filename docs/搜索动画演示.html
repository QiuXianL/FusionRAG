<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FusionRAG · 搜索动画演示</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
        background: #040A14; color: #E3E0D8;
        font-family: 'Inter', 'Microsoft YaHei', sans-serif;
        padding: 40px 20px;
    }
    h1 { font-size: 1.4rem; color: #C89B3C; margin-bottom: 8px; }
    .sub { color: #8B897F; font-size: 0.85rem; margin-bottom: 30px; }
    .demo-card {
        background: rgba(10,16,30,0.92); border: 1px solid rgba(200,155,60,0.2);
        border-radius: 14px; max-width: 620px; padding: 24px; margin-bottom: 30px;
    }
    .demo-card h2 { font-size: 0.95rem; color: #F0E6D2; margin-bottom: 16px; font-weight: 600; }
    .search-area { border: 1px solid rgba(200,155,60,0.15); border-radius: 10px; padding: 14px 16px; }
    .search-row { display: flex; gap: 8px; }
    .search-row input {
        flex: 1; background: rgba(255,255,255,0.03); border: 1px solid rgba(200,155,60,0.2);
        border-radius: 8px; padding: 8px 12px; font-size: 0.85rem; color: #E3E0D8; outline: none; font-family: inherit;
    }
    .search-row button {
        background: linear-gradient(135deg,#C89B3C,#B8860B); color: #1A1206; border: none;
        border-radius: 8px; padding: 8px 16px; font-size: 0.8rem; font-weight: 600; cursor: pointer; font-family: inherit;
    }
    .search-row button:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ═══ 搜索动画 ═══ */
    .doc-search-loading {
        display: flex; flex-direction: column; align-items: center; gap: 12px;
        padding: 26px 0 18px;
    }
    .doc-search-radar {
        position: relative; width: 56px; height: 56px;
        display: flex; align-items: center; justify-content: center;
    }
    .radar-icon {
        width: 30px; height: 30px; color: #C89B3C;
        filter: drop-shadow(0 0 6px rgba(200,155,60,0.5));
        position: relative; z-index: 2;
    }
    .radar-ring {
        position: absolute; inset: 0; border-radius: 50%;
        border: 2px solid rgba(200,155,60,0.35);
        animation: radarPulse 1.6s ease-out infinite;
    }
    .radar-ring.r2 { animation-delay: 0.53s; }
    .radar-ring.r3 { animation-delay: 1.06s; }
    @keyframes radarPulse {
        0%   { transform: scale(0.25); opacity: 1; }
        100% { transform: scale(1.35); opacity: 0; }
    }
    .doc-search-text {
        font-size: 0.78rem; color: #8B897F;
        font-family: 'Noto Serif SC', serif; letter-spacing: 0.05em;
        animation: loadingFade 1.8s ease-in-out infinite;
    }
    @keyframes loadingFade {
        0%,100% { opacity: 0.35; }
        50%     { opacity: 0.9; }
    }

    /* 结果占位 */
    .demo-result {
        background: rgba(0,0,0,0.2); border: 1px solid rgba(200,155,60,0.12);
        border-left: 3px solid #8B6B2A; border-radius: 0 8px 8px 0;
        padding: 10px 12px; margin-top: 10px; font-size: 0.76rem; color: #8B897F;
        line-height: 1.5;
    }
    .hidden { display: none; }
    .controls { display: flex; gap: 10px; margin-top: 14px; }
    .ctl-btn {
        background: rgba(255,255,255,0.04); border: 1px solid rgba(200,155,60,0.25);
        color: #C89B3C; border-radius: 9999px; padding: 7px 16px;
        font-size: 0.76rem; cursor: pointer; font-family: inherit; transition: all 0.25s;
    }
    .ctl-btn:hover { border-color: #C89B3C; box-shadow: 0 0 12px rgba(200,155,60,0.2); }
</style>
</head>
<body>

<h1>⚜ 文档搜索 · 雷达扫描动画演示</h1>
<p class="sub">金色放大镜 + 3 层扩散波纹 + 呼吸文案 · 纯 CSS 实现</p>

<div class="demo-card">
    <h2>模拟文档管理搜索区</h2>
    <div class="search-area">
        <div class="search-row">
            <input type="text" placeholder="输入关键词搜索文档…">
            <button onclick="demoSearch()">搜索</button>
        </div>

        <!-- 搜索动画（点击"开始搜索"显示） -->
        <div class="doc-search-loading hidden" id="searchLoading">
            <div class="doc-search-radar">
                <div class="radar-ring r1"></div>
                <div class="radar-ring r2"></div>
                <div class="radar-ring r3"></div>
                <svg class="radar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            </div>
            <span class="doc-search-text">贤者正在翻阅古籍…</span>
        </div>

        <!-- 结果占位 -->
        <div class="demo-result hidden" id="demoResult">找到 3 条结果：亚索的逃亡之路 / 永恩之死 / 素马长老之迷</div>
    </div>

    <div class="controls">
        <button class="ctl-btn" onclick="showLoading(true)">▶ 开始搜索</button>
        <button class="ctl-btn" onclick="showLoading(false)">■ 完成（隐藏）</button>
    </div>
</div>

<script>
function showLoading(show) {
    var l = document.getElementById('searchLoading');
    var r = document.getElementById('demoResult');
    l.classList.toggle('hidden', !show);
    r.classList.toggle('hidden', show);
}
function demoSearch() {
    showLoading(true);
    setTimeout(function() { showLoading(false); }, 2200);
}
</script>

</body>
</html>
